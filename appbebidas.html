<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santo Hostel - Freezer Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6 select-none">

    <!-- Cabeçalho -->
    <div class="text-center mt-6">
        <span class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full border border-amber-500/20">⚡ Autoatendimento</span>
        <h1 class="text-3xl font-bold tracking-tight mt-3">Freezer Inteligente</h1>
        <p class="text-slate-400 text-sm mt-1">Toque no produto desejado para abrir o pagamento.</p>
    </div>

    <!-- Seção de Seleção de Produtos -->
    <div id="selection-screen" class="w-full max-w-sm mx-auto grid grid-cols-1 gap-5 my-auto">
        <button onclick="comprar('Cerveja')" class="group relative bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold p-6 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-amber-400/30">
            <div class="flex items-center space-x-4">
                <span class="text-4xl">🍺</span>
                <div class="text-left">
                    <div class="text-xl font-extrabold text-slate-950">Cerveja Gelada</div>
                    <div class="text-xs text-slate-950/80 font-medium">Lata 350ml</div>
                </div>
            </div>
            <span class="bg-slate-950/10 text-slate-950 font-black py-2.5 px-4 rounded-xl text-lg">R$ 8,00</span>
        </button>

        <button onclick="comprar('Refrigerante')" class="group relative bg-gradient-to-r from-sky-500 to-sky-600 hover:from-sky-600 hover:to-sky-700 text-slate-950 font-bold p-6 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-sky-400/30">
            <div class="flex items-center space-x-4">
                <span class="text-4xl">🥤</span>
                <div class="text-left">
                    <div class="text-xl font-extrabold text-slate-950">Refrigerante</div>
                    <div class="text-xs text-slate-950/80 font-medium">Lata 350ml</div>
                </div>
            </div>
            <span class="bg-slate-950/10 text-slate-950 font-black py-2.5 px-4 rounded-xl text-lg">R$ 6,00</span>
        </button>
    </div>

    <!-- Seção de Carregamento (Loading) -->
    <div id="loading-screen" class="w-full max-w-sm mx-auto hidden flex flex-col items-center justify-center my-auto py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500 mb-4"></div>
        <p class="text-slate-300 font-medium">A preparar o pagamento...</p>
    </div>

    <!-- Rodapé -->
    <div class="text-center text-xs text-slate-600 mt-6">
        Santo Hostel • Powered by Daime Filmes
    </div>

    <script>
        // Substitua pelo Production URL unificado do seu webhook do n8n
        const N8N_WEBHOOK_URL = 'SUA_URL_DO_WEBHOOK_N8N_AQUI';

        async function comprar(produto) {
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produto: produto })
                });
                
                const data = await response.json();

                if (data.init_point) {
                    // Redireciona o hóspede para o Checkout Pro do Mercado Pago
                    window.location.href = data.init_point;
                } else {
                    alert('Erro ao iniciar o pagamento. Tente novamente.');
                    voltar();
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão com o servidor.');
                voltar();
            }
        }

        function voltar() {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
