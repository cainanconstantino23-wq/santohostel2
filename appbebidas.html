<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santo Hostel - Freezer Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-6 select-none">

    <!-- Tela de Seleção / Catálogo de Bebidas -->
    <div id="selection-screen" class="w-full max-w-sm mx-auto flex flex-col gap-4 my-auto">
        <div class="text-center mb-2">
            <span class="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full border border-amber-500/20">⚡ Autoatendimento</span>
            <h1 class="text-3xl font-bold tracking-tight mt-3">Freezer Inteligente</h1>
            <p class="text-slate-400 text-sm mt-1">Toque na bebida desejada para pagar.</p>
        </div>

        <!-- Lista de Bebidas e Testes -->
        <div class="grid grid-cols-1 gap-3.5">
            <!-- Água sem gás -->
            <button onclick="comprar('Água sem gás', 5.00)" class="group relative bg-gradient-to-r from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700 text-slate-950 font-bold p-3.5 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-teal-400/30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">💧</span>
                    <div class="text-left">
                        <div class="text-base font-extrabold text-slate-950">Água sem gás</div>
                        <div class="text-xs text-slate-950/80 font-medium">Garrafa 500ml</div>
                    </div>
                </div>
                <span class="bg-slate-950/10 text-slate-950 font-black py-1.5 px-3 rounded-xl text-sm">R$ 5,00</span>
            </button>

            <!-- Água com gás -->
            <button onclick="comprar('Água com gás', 6.00)" class="group relative bg-gradient-to-r from-cyan-500 to-cyan-600 hover:from-cyan-600 hover:to-cyan-700 text-slate-950 font-bold p-3.5 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-cyan-400/30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🧊</span>
                    <div class="text-left">
                        <div class="text-base font-extrabold text-slate-950">Água com gás</div>
                        <div class="text-xs text-slate-950/80 font-medium">Garrafa 500ml</div>
                    </div>
                </div>
                <span class="bg-slate-950/10 text-slate-950 font-black py-1.5 px-3 rounded-xl text-sm">R$ 6,00</span>
            </button>

            <!-- Coca-Cola -->
            <button onclick="comprar('Coca-Cola', 6.00)" class="group relative bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-slate-950 font-bold p-3.5 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-red-400/30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🥤</span>
                    <div class="text-left">
                        <div class="text-base font-extrabold text-slate-950">Coca-Cola</div>
                        <div class="text-xs text-slate-950/80 font-medium">Lata 350ml</div>
                    </div>
                </div>
                <span class="bg-slate-950/10 text-slate-950 font-black py-1.5 px-3 rounded-xl text-sm">R$ 6,00</span>
            </button>

            <!-- Guaraná -->
            <button onclick="comprar('Guaraná', 6.00)" class="group relative bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-slate-950 font-bold p-3.5 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-green-400/30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🍏</span>
                    <div class="text-left">
                        <div class="text-base font-extrabold text-slate-950">Guaraná</div>
                        <div class="text-xs text-slate-950/80 font-medium">Lata 350ml</div>
                    </div>
                </div>
                <span class="bg-slate-950/10 text-slate-950 font-black py-1.5 px-3 rounded-xl text-sm">R$ 6,00</span>
            </button>

            <!-- Heineken -->
            <button onclick="comprar('Heineken', 12.00)" class="group relative bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-slate-100 font-bold p-3.5 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-emerald-500/30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🍺</span>
                    <div class="text-left">
                        <div class="text-base font-extrabold text-slate-100">Heineken</div>
                        <div class="text-xs text-slate-300 font-medium">Lata / Long Neck 330ml</div>
                    </div>
                </div>
                <span class="bg-slate-950/30 text-emerald-300 font-black py-1.5 px-3 rounded-xl text-sm">R$ 12,00</span>
            </button>

            <!-- Stella Artois -->
            <button onclick="comprar('Stella Artois', 12.00)" class="group relative bg-gradient-to-r from-amber-200 to-amber-300 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-bold p-3.5 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-amber-300/30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🍻</span>
                    <div class="text-left">
                        <div class="text-base font-extrabold text-slate-950">Stella Artois</div>
                        <div class="text-xs text-slate-950/80 font-medium">Long Neck 330ml</div>
                    </div>
                </div>
                <span class="bg-slate-950/10 text-slate-950 font-black py-1.5 px-3 rounded-xl text-sm">R$ 12,00</span>
            </button>

            <!-- Amstel -->
            <button onclick="comprar('Amstel', 12.00)" class="group relative bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-slate-100 font-bold p-3.5 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-red-500/30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🍺</span>
                    <div class="text-left">
                        <div class="text-base font-extrabold text-slate-100">Amstel</div>
                        <div class="text-xs text-slate-300 font-medium">Lata 350ml</div>
                    </div>
                </div>
                <span class="bg-slate-950/30 text-red-200 font-black py-1.5 px-3 rounded-xl text-sm">R$ 12,00</span>
            </button>

            <!-- Teste Melancia -->
            <button onclick="comprar('Melancia', 1.00)" class="group relative bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-slate-950 font-bold p-3.5 rounded-2xl shadow-xl transition-all duration-200 transform active:scale-95 flex items-center justify-between border border-pink-400/30">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🍉</span>
                    <div class="text-left">
                        <div class="text-base font-extrabold text-slate-950">Teste Melancia</div>
                        <div class="text-xs text-slate-950/80 font-medium">Item de Teste</div>
                    </div>
                </div>
                <span class="bg-slate-950/10 text-slate-950 font-black py-1.5 px-3 rounded-xl text-sm">R$ 1,00</span>
            </button>
        </div>
    </div>

    <!-- Tela de Carregamento (Gerando Pagamento) -->
    <div id="loading-screen" class="w-full max-w-sm mx-auto hidden flex flex-col items-center justify-center my-auto py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500 mb-4"></div>
        <p class="text-slate-300 font-medium">A preparar pagamento...</p>
    </div>

    <!-- Tela de Sucesso (Porta a Abrir) -->
    <div id="success-screen" class="w-full max-w-sm mx-auto hidden flex flex-col items-center justify-center my-auto py-12 text-center">
        <span class="text-6xl mb-4">🔓</span>
        <h2 class="text-2xl font-bold text-emerald-400">Pagamento Aprovado!</h2>
        <p class="text-slate-300 text-sm mt-2">A abrir a porta do freezer... Pode retirar o seu produto!</p>
        <button onclick="voltarAoCatalogo()" class="mt-6 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2.5 px-5 rounded-xl border border-slate-700 transition-all">
            Comprar Outra Bebida
        </button>
    </div>

    <div class="text-center text-xs text-slate-600 mt-6">
        Santo Hostel • Autoatendimento
    </div>

    <script>
        const N8N_CHECKOUT_URL = 'https://freezersantohostel.app.n8n.cloud/webhook/freezer';
        const N8N_SUCCESS_URL = 'https://freezersantohostel.app.n8n.cloud/webhook/pagamentos';

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentId = urlParams.get('payment_id') || urlParams.get('collection_id') || urlParams.get('id');
            const status = urlParams.get('status') || urlParams.get('collection_status') || urlParams.get('payment_status');

            if (paymentId) {
                const lastProcessedId = sessionStorage.getItem('processed_payment_id');
                if (lastProcessedId !== paymentId) {
                    sessionStorage.setItem('processed_payment_id', paymentId);

                    document.getElementById('selection-screen').classList.add('hidden');
                    document.getElementById('success-screen').classList.remove('hidden');

                    try {
                        await fetch(N8N_SUCCESS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                data: { id: paymentId },
                                status: status || 'approved',
                                action: 'payment.created'
                            })
                        });
                    } catch (error) {
                        console.error("Erro ao acionar fechadura:", error);
                    }
                } else {
                    document.getElementById('selection-screen').classList.add('hidden');
                    document.getElementById('success-screen').classList.remove('hidden');
                }
            }
        });

        function voltarAoCatalogo() {
            // Limpa a URL e restaura a tela inicial
            window.history.replaceState({}, document.title, window.location.pathname);
            document.getElementById('success-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('selection-screen').classList.remove('hidden');
        }

        async function comprar(produto, valor) {
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            try {
                const response = await fetch(N8N_CHECKOUT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ produto: produto, valor: valor })
                });
                
                const data = await response.json();
                let redirectUrl = data.init_point || data.json?.init_point || data[0]?.init_point || data[0]?.json?.init_point;

                if (redirectUrl) {
                    window.location.href = redirectUrl;
                } else {
                    throw new Error('Link não encontrado');
                }
            } catch (error) {
                console.error(error);
                alert('Erro ao gerar pagamento. Tente novamente.');
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('selection-screen').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
